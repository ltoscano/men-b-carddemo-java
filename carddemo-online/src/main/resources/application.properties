spring.application.name=carddemo-online
management.endpoints.web.exposure.include=health
# La risposta di /actuator/health elenca i componenti (tra cui "db"), senza i dettagli.
management.endpoint.health.show-components=always
# Indirizzo, utente e password del database arrivano dalle variabili d'ambiente
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# (impostate da compose.yaml).

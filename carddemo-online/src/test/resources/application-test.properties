# Configurazione valida solo per i test (profilo "test", attivato dal test di contesto):
# il contesto si carica senza database. Nessun database in memoria o incorporato: la
# sorgente dati semplicemente non viene configurata. La prova con PostgreSQL vero e' lo
# smoke test (./smoke.sh).
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

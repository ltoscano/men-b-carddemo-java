name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build e test in container (con test di integrazione PostgreSQL)
        run: ./verify.sh
      - name: Nessun container di test rimasto
        if: always()
        run: |
          set -euo pipefail
          label=menb.verify.run
          containers="$(docker ps -a -q --filter "label=${label}")"
          if [ -n "${containers}" ]; then
            echo "Container di test rimasti: ${containers}"
            exit 1
          fi
          echo "nessun container con l'etichetta ${label}"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Smoke test dello stack Compose
        run: ./smoke.sh
      - name: Nessuna risorsa del progetto di smoke rimasta
        if: always()
        run: |
          set -euo pipefail
          label=com.docker.compose.project=menb-smoke
          containers="$(docker ps -a -q --filter "label=${label}")"
          networks="$(docker network ls -q --filter "label=${label}")"
          volumes="$(docker volume ls -q --filter "label=${label}")"
          if [ -n "${containers}${networks}${volumes}" ]; then
            echo "Risorse rimaste: ${containers} ${networks} ${volumes}"
            exit 1
          fi
          echo "nessun container, rete o volume con l'etichetta ${label}"

name: Analisi del legacy

# Controlli di analysis/ (strumenti, attesi, verdetti, prove negative). File distinto da ci.yml.
on:
  push:
  pull_request:

jobs:
  analysis-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Il runner parte senza immagini ne' volume: run.sh li costruisce (immagini) e li crea (volume del legacy).
      - name: Controlli di analysis/
        run: ./analysis/run.sh --all --check

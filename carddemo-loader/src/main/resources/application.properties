spring.application.name=carddemo-loader
# Applicazione che carica un file e termina: nessun server web.
spring.main.web-application-type=none
# Flyway applica all'avvio le migrazioni di db/migration (nel jar di carddemo-domain), con la
# configurazione predefinita di Spring Boot, come online e batch.
# Indirizzo, utente e password del database arrivano dalle variabili d'ambiente
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# (impostate da compose.yaml).

spring.application.name=carddemo-batch
spring.main.web-application-type=none
# Le tabelle dei metadati di Spring Batch vengono create in PostgreSQL se mancano.
spring.batch.jdbc.initialize-schema=always
# Indirizzo, utente e password del database arrivano dalle variabili d'ambiente
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# (impostate da compose.yaml).
# Job READACCT (issue #67): lo standard output contiene solo le righe dei DISPLAY di CBACT01C
# (contratto in docs/contratti.md). Niente banner; i log vanno sullo standard error con la
# configurazione di carddemo-batch-logback.xml (formato e livelli predefiniti di Spring Boot).
spring.main.banner-mode=off
logging.config=classpath:carddemo-batch-logback.xml
